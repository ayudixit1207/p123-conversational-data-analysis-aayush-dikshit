<!DOCTYPE html>
<html>

<head>

    <title>Query History</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="container">

    <header>

        <h1>Query History</h1>

        <nav>
            <a href="/">Dashboard</a>
            <a href="/files">Files</a>
            <a href="/ask-page">Ask</a>
            <a href="/history">History</a>
        </nav>

    </header>

    <section class="card">

        <button id="deleteAllHistory" type="button">
            Delete All History
        </button>

        <div id="history">
            Loading history...
        </div>

    </section>

</div>

<script>
async function loadHistory() {
    const box = document.getElementById("history");

    try {
        const response = await fetch("/history-data");
        const history = await response.json();
        const deleteAllButton = document.getElementById("deleteAllHistory");

        if (!response.ok) {
            throw new Error(history.error || "Could not load history.");
        }

        box.replaceChildren();

        if (history.length === 0) {
            box.innerText = "No queries yet.";
            deleteAllButton.disabled = true;
            return;
        }

        deleteAllButton.disabled = false;

        history.forEach(item => {
            const entry = document.createElement("div");
            entry.className = "history-item";

            const question = document.createElement("h3");
            question.innerText = item.question;

            const answer = document.createElement("p");
            answer.innerText = item.answer;

            const createdAt = document.createElement("small");
            createdAt.innerText = item.created_at;

            entry.append(question, answer, createdAt);

            if (item.chart) {
                const chartInfo = document.createElement("p");
                chartInfo.innerText = `Chart: ${item.chart.type}`;
                entry.appendChild(chartInfo);
            }

            const deleteButton = document.createElement("button");
            deleteButton.type = "button";
            deleteButton.innerText = "Delete";
            deleteButton.addEventListener("click", async () => {
                if (!window.confirm("Delete this history entry?")) {
                    return;
                }

                try {
                    const deleteResponse = await fetch(
                        `/history-data/${encodeURIComponent(item.query_id)}`,
                        { method: "DELETE" }
                    );
                    const result = await deleteResponse.json();

                    if (!deleteResponse.ok) {
                        throw new Error(result.error || "Could not delete entry.");
                    }

                    await loadHistory();
                } catch (error) {
                    window.alert(error.message);
                }
            });

            entry.appendChild(deleteButton);
            box.appendChild(entry);
        });
    } catch (error) {
        box.innerText = error.message;
    }
}

document.getElementById("deleteAllHistory").addEventListener("click", async () => {
    if (!window.confirm("Delete all query history? This cannot be undone.")) {
        return;
    }

    try {
        const response = await fetch("/delete-all-history", {
            method: "DELETE",
        });
        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.error || "Could not delete history.");
        }

        await loadHistory();
    } catch (error) {
        window.alert(error.message);
    }
});

loadHistory();
</script>

</body>

</html>
